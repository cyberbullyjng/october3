<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>october — commands</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #000;
    --surface: #0a0a0a;
    --border: #1a1a1a;
    --border-hover: #2a2a2a;
    --text: #c8c8c8;
    --text-dim: #555;
    --text-bright: #e8e8e8;
    --red: #cc2200;
    --red-dim: #441100;
    --mono: 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 300;
    min-height: 100vh;
    line-height: 1.6;
  }

  /* ── Nav ─────────────────────────────────────────────── */
  nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(0,0,0,0.95);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(8px);
  }
  .nav-inner {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 24px;
    height: 52px;
    display: flex;
    align-items: center;
    gap: 40px;
  }
  .nav-logo {
    color: var(--text-bright);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-decoration: none;
  }
  .nav-logo span { color: var(--red); }
  .nav-links { display: flex; gap: 28px; margin-left: auto; }
  .nav-links a {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 0.06em;
    transition: color 0.15s;
  }
  .nav-links a:hover, .nav-links a.active { color: var(--text-bright); }
  .nav-links a.active { color: var(--red); }

  /* ── Page ────────────────────────────────────────────── */
  .page {
    max-width: 900px;
    margin: 0 auto;
    padding: 64px 24px 120px;
  }

  .page-header {
    margin-bottom: 52px;
  }
  .page-header h1 {
    font-size: 28px;
    font-weight: 300;
    color: var(--text-bright);
    letter-spacing: -0.01em;
    margin-bottom: 8px;
  }
  .page-header h1 span { color: var(--red); }
  .page-header p {
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: 0.04em;
  }

  /* ── Search ──────────────────────────────────────────── */
  .search-wrap {
    margin-bottom: 48px;
    position: relative;
  }
  .search-wrap::before {
    content: '>';
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--red);
    font-size: 13px;
    pointer-events: none;
  }
  #search {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-bright);
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 300;
    padding: 12px 16px 12px 32px;
    outline: none;
    transition: border-color 0.15s;
  }
  #search::placeholder { color: var(--text-dim); }
  #search:focus { border-color: var(--red); }

  /* ── Stats bar ───────────────────────────────────────── */
  .stats {
    display: flex;
    gap: 32px;
    margin-bottom: 48px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat-val { color: var(--red); font-size: 22px; font-weight: 500; }
  .stat-label { color: var(--text-dim); font-size: 11px; letter-spacing: 0.06em; }

  /* ── Filter tabs ─────────────────────────────────────── */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 40px;
  }
  .filter-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.05em;
    padding: 5px 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-btn:hover { border-color: var(--border-hover); color: var(--text); }
  .filter-btn.active { border-color: var(--red); color: var(--red); background: var(--red-dim); }

  /* ── Category ────────────────────────────────────────── */
  .category { margin-bottom: 48px; }
  .category-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .category-name {
    color: var(--text-bright);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .category-count {
    color: var(--text-dim);
    font-size: 11px;
  }

  /* ── Command row ─────────────────────────────────────── */
  .cmd {
    display: flex;
    align-items: baseline;
    gap: 16px;
    padding: 9px 0;
    border-bottom: 1px solid transparent;
    transition: all 0.12s;
  }
  .cmd:hover { border-bottom-color: var(--border); }
  .cmd:hover .cmd-name { color: var(--red); }
  .cmd-name {
    color: var(--text-bright);
    font-weight: 400;
    min-width: 190px;
    flex-shrink: 0;
    font-size: 12.5px;
    transition: color 0.12s;
  }
  .cmd-name::before { content: '!'; color: var(--red); margin-right: 1px; }
  .cmd-desc {
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1.5;
  }

  /* ── No results ──────────────────────────────────────── */
  #no-results {
    display: none;
    color: var(--text-dim);
    font-size: 13px;
    padding: 48px 0;
    text-align: center;
  }
  #no-results span { color: var(--red); }

  /* ── Scrollbar ───────────────────────────────────────── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #222; }
  ::-webkit-scrollbar-thumb:hover { background: #333; }

  /* ── Mobile ──────────────────────────────────────────── */
  @media (max-width: 600px) {
    .cmd { flex-direction: column; gap: 4px; }
    .cmd-name { min-width: unset; }
    .stats { gap: 20px; }
    .stat-val { font-size: 18px; }
    .page { padding: 40px 16px 80px; }
    .nav-inner { gap: 20px; padding: 0 16px; }
  }
</style>
</head>

<nav>
  <div class="nav-inner">

      ["lastfm set",     "Link your Last.fm account"],
      ["lastfm unset",   "Unlink your Last.fm account"],
      ["lastfm artist",  "Get info about an artist from Last.fm"],
      ["lastfm recent",  "Show your recent scrobble history"],
      ["lastfm lb",      "Last.fm scrobble leaderboard for the server"],
    ]
  },
];

const listEl   = document.getElementById("cmd-list");
const searchEl = document.getElementById("search");
const filtersEl = document.getElementById("filters");
const noRes    = document.getElementById("no-results");
const stTerm   = document.getElementById("search-term");
const totalEl  = document.getElementById("total-count");
const catEl    = document.getElementById("cat-count");

let activeFilter = "all";

let totalCmds = 0;
CATEGORIES.forEach(c => { totalCmds += c.cmds.length; });
totalEl.textContent = totalCmds;
catEl.textContent = CATEGORIES.length;

CATEGORIES.forEach(cat => {
  const btn = document.createElement("button");
  btn.className = "filter-btn";
  btn.dataset.cat = cat.name;
  btn.textContent = cat.name.split("—")[0].trim().toLowerCase();
  filtersEl.appendChild(btn);
});

function buildList(query) {
  query = (query || "").toLowerCase().trim();
  listEl.innerHTML = "";
  let anyVisible = false;

  CATEGORIES.forEach(cat => {
    const filtered = cat.cmds.filter(([name, desc]) => {
      const matchSearch = !query || name.toLowerCase().includes(query) || desc.toLowerCase().includes(query);
      const matchFilter = activeFilter === "all" || activeFilter === cat.name;
      return matchSearch && matchFilter;
    });

    if (filtered.length === 0) return;
    anyVisible = true;

    const catDiv = document.createElement("div");
    catDiv.className = "category";
    catDiv.dataset.cat = cat.name;

    const hdr = document.createElement("div");
    hdr.className = "category-header";
    hdr.innerHTML = `<span class="category-name">${cat.name}</span><span class="category-count">${filtered.length} command${filtered.length !== 1 ? "s" : ""}</span>`;
    catDiv.appendChild(hdr);

    filtered.forEach(([name, desc]) => {
      const row = document.createElement("div");
      row.className = "cmd";
      row.innerHTML = `<span class="cmd-name">${name}</span><span class="cmd-desc">${desc}</span>`;
      catDiv.appendChild(row);
    });

    listEl.appendChild(catDiv);
  });

  if (!anyVisible) {
    noRes.style.display = "block";
    stTerm.textContent = query;
  } else {
    noRes.style.display = "none";
  }
}

searchEl.addEventListener("input", () => buildList(searchEl.value));

filtersEl.addEventListener("click", e => {
  const btn = e.target.closest(".filter-btn");
  if (!btn) return;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  activeFilter = btn.dataset.cat;
  buildList(searchEl.value);
  window.scrollTo({ top: 0, behavior: "smooth" });
});

buildList("");
</script>
</body>
</html>
